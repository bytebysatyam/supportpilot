services:
  postgres:
    image: postgres:17-alpine
    container_name: supportpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportpilot
      POSTGRES_PASSWORD: supportpilot
      POSTGRES_DB: supportpilot
    ports:
      - "5432:5432"
    volumes:
      - supportpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportpilot -d supportpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: supportpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - supportpilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  supportpilot_postgres_data:
  supportpilot_redis_data:
